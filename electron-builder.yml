# Packaging configuration. productName and version are read from package.json,
# so renaming the product only requires changing package.json "productName".
appId: com.mediaflow.desktop
copyright: Copyright © 2026 MediaFlow Contributors

directories:
  output: release/${version}
  buildResources: resources/build

files:
  - out/**/*
  - '!out/bundled-packages.*.json'
  - package.json
  - '!**/*.map'
  # better-sqlite3: the SQLite C sources are only needed to compile it, and only the
  # prebuilt binary for the target platform is used (kept per platform below).
  - '!node_modules/better-sqlite3/{deps,src}/**'
  - '!node_modules/better-sqlite3/binding.gyp'
  - '!node_modules/better-sqlite3/prebuilds/*'
  # openpgp: the main process loads dist/node/openpgp.min.cjs only.
  - '!node_modules/openpgp/dist/{lightweight,types}/**'
  - '!node_modules/openpgp/dist/*.{js,mjs}'
  - '!node_modules/openpgp/dist/node/*.mjs'
  - '!node_modules/openpgp/dist/node/openpgp.cjs'

# better-sqlite3 is an N-API module that ships prebuilt binaries for every
# supported platform/arch and selects one at runtime, so no rebuild against
# Electron's headers (and no C++ toolchain) is needed. This also keeps
# cross-architecture builds possible.
npmRebuild: false

asar: true
asarUnpack:
  # Native modules (better-sqlite3) cannot be loaded from inside the asar archive.
  - '**/*.node'
  # OpenPGP.js is LGPL-3.0-or-later: kept outside the integrity-checked archive so users can
  # replace it with a modified version, as the LGPL requires.
  - node_modules/openpgp/**

# Electron fuses, flipped in the packaged binary. The app never runs itself as Node
# (no ELECTRON_RUN_AS_NODE, no process.fork), never needs NODE_OPTIONS or --inspect in
# production, and only loads its code from the integrity-checked app.asar.
# The UI is served from app://mediaflow/ (electron/app-protocol.ts), so file:// pages need no extra privileges.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

extraResources:
  # licenses/THIRD_PARTY_LICENSES.txt is generated by scripts/licenses.mjs (run by scripts/dist.mjs).
  - from: resources/licenses
    to: licenses
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
  - from: LICENSE
    to: LICENSE.txt
  # Window icon on Linux (other platforms take it from the executable).
  - from: resources/build/icon.png
    to: icon.png

win:
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64]
  files:
    - node_modules/better-sqlite3/prebuilds/win32-${arch}.node
  # Code signing: set CSC_LINK / CSC_KEY_PASSWORD (a .pfx, base64 or path) in CI secrets.
  # Unsigned builds work but trigger SmartScreen; signed builds also let electron-updater
  # verify the publisher of downloaded updates.

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}-${arch}.${ext}

mac:
  category: public.app-category.video
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/build/entitlements.mac.plist
  entitlementsInherit: resources/build/entitlements.mac.plist
  files:
    - node_modules/better-sqlite3/prebuilds/darwin-${arch}.node
  # Signing and notarization run only when CI secrets provide them: CSC_LINK / CSC_KEY_PASSWORD
  # (Developer ID Application certificate) and APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER
  # (App Store Connect API key, recommended) or APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID.
  # Without them the app is unsigned: Gatekeeper warns and in-app updates cannot be installed.

dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  category: AudioVideo
  maintainer: MediaFlow Contributors
  synopsis: Media downloader and audio converter built on yt-dlp and FFmpeg
  files:
    - node_modules/better-sqlite3/prebuilds/linux-${arch}.node
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]
  artifactName: ${productName}-${version}-${arch}.${ext}

# Application updates (electron-updater, GitHub Releases): the publish settings are added by
# scripts/dist.mjs from MEDIAFLOW_GITHUB_OWNER / MEDIAFLOW_GITHUB_REPO, so builds made without them
# have no update feed. See README → Building and releasing.
