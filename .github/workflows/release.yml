# Builds installers for every platform from a version tag (v1.0.0, …) and publishes them,
# with checksums and the update manifests electron-updater reads, as a draft GitHub Release.
# A maintainer reviews the draft and publishes it; only published releases reach users.
#
# Secrets (all optional; without them the builds are unsigned):
#   WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD       Windows code-signing certificate (.pfx, base64) and password
#   MAC_CSC_LINK, MAC_CSC_KEY_PASSWORD       macOS "Developer ID Application" certificate (.p12, base64) and password
#   APPLE_API_KEY_P8, APPLE_API_KEY_ID, APPLE_API_ISSUER   App Store Connect API key for notarization
name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify (lint, tests, licenses)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - name: Changelog has notes for this version
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Install FFmpeg for the conversion tests
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm test
      - run: npm run build
      - run: node scripts/licenses.mjs --check
      - run: npm audit --omit=dev --audit-level=moderate

  build:
    name: Build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win
          - name: macOS
            os: macos-latest
            args: --mac
          - name: Linux
            os: ubuntu-latest
            args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends rpm

      - name: Signing credentials
        if: runner.os != 'Linux'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          certificate=""
          if [ "$RUNNER_OS" = "Windows" ]; then certificate="$WIN_CSC_LINK"; fi
          if [ "$RUNNER_OS" = "macOS" ]; then certificate="$MAC_CSC_LINK"; fi
          if [ -z "$certificate" ]; then
            echo "::warning::No signing certificate for $RUNNER_OS: the installers are unsigned (SmartScreen/Gatekeeper warnings; macOS cannot install updates)."
            echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"
          fi
          # electron-builder expects the App Store Connect key as a file.
          if [ "$RUNNER_OS" = "macOS" ] && [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$APPLE_API_KEY_P8" > "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi

      - name: Build and package
        shell: bash
        env:
          YTDLPP_GITHUB_OWNER: ${{ github.repository_owner }}
          YTDLPP_GITHUB_REPO: ${{ github.event.repository.name }}
          CSC_LINK: ${{ runner.os == 'Windows' && secrets.WIN_CSC_LINK || runner.os == 'macOS' && secrets.MAC_CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'Windows' && secrets.WIN_CSC_KEY_PASSWORD || runner.os == 'macOS' && secrets.MAC_CSC_KEY_PASSWORD || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          npm run build
          node scripts/dist.mjs ${{ matrix.args }} --publish never

      - name: Verify packages
        run: node scripts/verify-package.cjs --all

      - name: Collect artifacts
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p artifacts
          cd "release/$version"
          for f in *.exe *.dmg *.zip *.AppImage *.deb *.rpm *.blockmap latest*.yml; do
            if [ -f "$f" ]; then cp "$f" ../../artifacts/; fi
          done
          ls -la ../../artifacts

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: packages-${{ matrix.name }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: packages-*
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum -- * | tee SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {found=1; next} found && /^## \[/ {exit} found {print}' CHANGELOG.md > notes.md
          printf '\n---\nVerify downloads against `SHA256SUMS.txt`. YT-DLP++ downloads its media engines (yt-dlp, FFmpeg, Deno) on first use, with your confirmation.\n' >> notes.md
          cat notes.md
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "YT-DLP++ ${GITHUB_REF_NAME#v}" --notes-file notes.md artifacts/*
